services:
  # This makes Metube available only through traefik
  traefik: {}

  # This makes Metube available on all network interfaces of the host, including the host IP and through traefik (if enabled)
  all:
    ports:
      - ${PORT_LW_LINKWARDEN_EXTERNAL:-3004}:${PORT_LW_LINKWARDEN_INTERNAL:-8081}

  # This makes Metube available only on the host computer, not to any other computers on the same network
  localhost:
    ports:
      - 127.0.0.1:${PORT_LW_LINKWARDEN_EXTERNAL:-3004}:${PORT_LW_LINKWARDEN_INTERNAL:-8081}
  
  # This makes Metube available only on the Tailscale IP address of the host, allowing access over Tailscale VPN and through traefik (if enabled)
  tailscale:
    ports:
      - ${IP_TAILSCALE}:${PORT_LW_LINKWARDEN_EXTERNAL:-3004}:${PORT_LW_LINKWARDEN_INTERNAL:-8081}