services:
  traefik:
    image: ${DOCKER_IMAGE_TR_TRAEFIK:-traefik:latest}
    container_name: ${CONTAINER_NAME_TR_TRAEFIK:-traefik}
    hostname: ${HOST_NAME_TR_TRAEFIK:-traefik}
    # user: "${UID}:${GID}"
    restart: ${RESTART_TR_TRAEFIK:-unless-stopped}
    networks:
      traefiknet:
        ipv4_address: ${IP_TR_TRAEFIK:-172.16.0.3}
    deploy:
      resources:
        limits:
          cpus: ${CPU_MAX_TR_TRAEFIK:-1.5}
          memory: ${RAM_MAX_TR_TRAEFIK:-256M}
        reservations:
          cpus: ${CPU_MIN_TR_TRAEFIK:-0.05}
          memory: ${RAM_MIN_TR_TRAEFIK:-6M}
    env_file:
      - .env
      - ../00.env/host.env
      - ../00.env/network.env
    # security_opt:
    #   - no-new-privileges:true
    #   - apparmor:docker-default
    ports:
      - ${IP_TAILSCALE}:${HTTP_PORT:-80}:80
      - ${IP_TAILSCALE}:${HTTPS_PORT:-443}:443
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - TRAEFIK_DASHBOARD_CREDENTIALS=${TRAEFIK_DASHBOARD_CREDENTIALS} # Use `echo $(htpasswd -nB <user>) | sed -e s/\\$/\\$\\$/g` to generate the password. Replace <user> with your username
      # - CF_API_KEY=YOUR_API_KEY
      # be sure to use the correct one depending on if you are using a token or key
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DIR_COMPOSE}/${DIR_NAME_TR_TRAEFIK}/data/traefik.yml:/traefik.yml:ro
      - ${DIR_COMPOSE}/${DIR_NAME_TR_TRAEFIK}/data/acme.json:/acme.json
      - ${DIR_COMPOSE}/${DIR_NAME_TR_TRAEFIK}/data/config.yml:/config.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`${APP_NAME_TR_TRAEFIK}.${HOST_NAME}.${DOMAIN}`)"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_CREDENTIALS}" # install apache2-utils and then echo $(htpasswd -nb "<USER>" "<PASSWORD>") | sed -e s/\\$/\\$\\$/g and then use this to prompt the password: echo $(htpasswd -nB USER) | sed -e s/\\$/\\$\\$/g
      - "traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.traefik.middlewares=traefik-https-redirect"
      - "traefik.http.routers.traefik-secure.entrypoints=https"
      - "traefik.http.routers.traefik-secure.rule=Host(`${APP_NAME_TR_TRAEFIK}.${HOST_NAME}.${DOMAIN}`)"
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=${HOST_NAME}.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.${HOST_NAME}.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.service=api@internal"

networks:
  traefiknet:
    name: ${DOCKER_NETWORK:-traefiknet}
    external: true