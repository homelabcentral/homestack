name: ${STACK_IM_IMMICH:-immich}
services:
  immich:
    image: ${DOCKER_IMAGE_IM_IMMICH:-ghcr.io/immich-app/immich-server:release}
    container_name: ${CONTAINER_NAME_IM_IMMICH:-immich}
    restart: ${RESTART_IM_IMMICH:-always}
    network_mode: service:immich-database
    extends:
      file: hwaccel.transcoding.yml
      service: ${HWACCEL_TRANSCODING_SERVICE:-cpu} # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    depends_on:
      - immich-redis
      - immich-database
    # skipping the below resources and let the OS/docker manage it, as setting the requirements too low can cause issues.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: ${CPU_MAX_IM_IMMICH}
    #       memory: ${RAM_MAX_IM_IMMICH}
    #     reservations:
    #       cpus: ${CPU_MIN_IM_IMMICH:-0.05}
    #       memory: ${RAM_MIN_IM_IMMICH:-6M}
    environment:
      - TZ=${TZ}
      - IMMICH_ALLOW_SETUP=${IMMICH_ALLOW_SETUP:-true}
      - DB_HOSTNAME=${IMMICH_HOSTNAME:-127.0.0.1}
      - DB_PORT=${IMMICH_DB_PORT:-5432}
      - DB_USERNAME=${IMMICH_DB_USERNAME:-immich}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-immich}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - REDIS_HOSTNAME=${IMMICH_HOSTNAME:-127.0.0.1}
      - REDIS_PORT=${IMMICH_REDIS_PORT:-6379}
    env_file:
      - .env
      - ../00.env/host.env
      - ../00.env/network.env
    volumes:
      # - ${UPLOAD_LOCATION}:/data
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    # Uncomment this if not running traefik or other reverse proxy and want to access gatus directly via http://<IP_PUBLIC>:3012 or http://<IP_TAILSCALE>:3012
    # You do not need to change the external port, it is designed to work nicely with other containers.
    # ports:
    #   - ${IP_TAILSCALE}:${PORT_IM_IMMICH_EXTERNAL:-3014}:${PORT_IM_IMMICH_INTERNAL:-2283}
    # OR if you don't want to bind to a specific IP, you can use:
    # ${PORT_IM_IMMICH_EXTERNAL:-3014}:${PORT_IM_IMMICH_INTERNAL:-2283}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}.entrypoints=http"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}.rule=Host(`${APP_NAME_IM_IMMICH:-immich}.${HOST_NAME}.${DOMAIN}`)"
      - "traefik.http.middlewares.${APP_NAME_IM_IMMICH:-immich}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}.middlewares=${APP_NAME_IM_IMMICH:-immich}-https-redirect"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}-secure.entrypoints=https"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}-secure.rule=Host(`${APP_NAME_IM_IMMICH:-immich}.${HOST_NAME}.${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}-secure.tls=true"
      - "traefik.http.routers.${APP_NAME_IM_IMMICH:-immich}-secure.service=${APP_NAME_IM_IMMICH:-immich}"
      - "traefik.http.services.${APP_NAME_IM_IMMICH:-immich}.loadbalancer.server.port=${PORT_IM_IMMICH_INTERNAL:-2283}"
      - "traefik.docker.network=${DOCKER_NETWORK:-traefiknet}"
  
  immich-machine-learning:
    image: ${DOCKER_IMAGE_IM_ML:-ghcr.io/immich-app/immich-machine-learning}:release-${HWACCEL_ML_SERVICE}
    container_name: ${CONTAINER_NAME_IM_ML:-immich-ml}
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
      file: hwaccel.ml.yml
      service: ${HWACCEL_ML_SERVICE} # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    network_mode: service:immich-database
    restart: ${RESTART_IM_IMMICH:-always}
    healthcheck:
      disable: false
    environment:
      - TZ=${TZ}
    env_file:
      - .env
      - ../00.env/host.env
      - ../00.env/network.env
    volumes:
      - ${DIR_DATA}/${DIR_IM_IMMICH:-immich}/model-cache:/cache
    
  immich-redis:
    image: ${DOCKER_IMAGE_IM_REDIS:-docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9}
    container_name: ${CONTAINER_NAME_IM_REDIS:-immich-redis}
    network_mode: service:immich-database
    restart: ${RESTART_IM_IMMICH:-always}
    healthcheck:
      test: redis-cli ping || exit 1
    environment:
      - TZ=${TZ}
    env_file:
      - .env

  immich-database:
    image: ${DOCKER_IMAGE_IM_DATABASE:-ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23}
    container_name: ${CONTAINER_NAME_IM_DATABASE:-immich-database}
    hostname: ${HOST_NAME_IM_DATABASE:-immich-database}
    restart: ${RESTART_IM_IMMICH:-always}
    networks:
      traefiknet:
        ipv4_address: ${IP_IM_IMMICH:-172.16.0.21}
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=${IMMICH_DB_USERNAME}
      - POSTGRES_DB=${IMMICH_DB_NAME}
      - POSTGRES_INITDB_ARGS='--data-checksums'
      - TZ=${TZ}
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # - DB_STORAGE_TYPE=HDD
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DIR_DATA}/${DIR_IM_IMMICH:-immich}/db:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

networks:
  traefiknet:
    name: ${DOCKER_NETWORK:-traefiknet}
    external: true
