services:
  pihole-unbound:
    image: ${DOCKER_IMAGE_PH_PIHOLE:-mpgirro/pihole-unbound:latest}
    container_name: ${CONTAINER_NAME_PH_PIHOLE:-pihole-unbound}
    hostname: ${HOST_NAME_PH_PIHOLE:-pihole-unbound}
    restart: ${RESTART_PH_PIHOLE:-always}
      # domainname: ${DOMAIN_NAME}
    networks:
      traefiknet:
        ipv4_address: ${IP_PH_PIHOLE:-172.16.0.2}
    deploy:
      resources:
        limits:
          cpus: ${CPU_MAX_PH_PIHOLE:-1.5}
          memory: ${RAM_MAX_PH_PIHOLE:-256M}
        reservations:
          cpus: ${CPU_MIN_PH_PIHOLE:-0.05}
          memory: ${RAM_MIN_PH_PIHOLE:-6M}
    extends:
      file: ports-dashboard.yml # Combines DNS port exposure and dashboard exposure choices into one valid extends target.
      service: ${PH_PIHOLE_PORT_CONFIG:-localhost}-${PH_PIHOLE_DASHBOARD_CONFIG:-localhost} # DNS choices: all|localhost|tailscale. Dashboard choices: traefik|all|localhost|tailscale.
    env_file:
      - .env
      - ../00.env/host.env
      - ../00.env/network.env
    environment:
      - TZ=${TZ:-UTC}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:-supersecretpassword}
      - FTLCONF_webserver_interface_theme=${PIHOLE_THEME:-default-dark}
        # - FTLCONF_dns_revServers=${REV_SERVER:-false},${REV_SERVER_CIDR},${REV_SERVER_TARGET},${REV_SERVER_DOMAIN}
      - FTLCONF_dns_upstreams=127.0.0.1#5335
      - FTLCONF_dns_dnssec=true
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_webserver_port=${PORT_PH_PIHOLE:-80} # ,443s
      # - FTLCONF_pihole_uid=${UID}
      # - FTLCONF_pihold_gid=${GID}
      - PIHOLE_UID=${UID}
      - PIHOLE_GID=${GID} # OR PIHOLE_GID=${GID_DOCKER}
    volumes:
      - etc_pihole-unbound:/etc/pihole:rw
      - etc_pihole_dnsmasq-unbound:/etc/dnsmasq.d:rw
    # ports:
    #   # - 8443:443/tcp
    #   - ${IP_TAILSCALE}:53:53/tcp
    #   - ${IP_TAILSCALE}:53:53/udp
    #   # - ${PORT_PH_PIHOLE:-8000}:${PORT_PH_PIHOLE:-8000}/tcp
    #   # - ${IP_TAILSCALE}:${PORT_PH_PIHOLE:-8000}:${PORT_PH_PIHOLE:-8000}/tcp #Allows use of different port to access pihole web interface when other docker containers use port 80
    #   # - 5335:5335/tcp # Uncomment to enable unbound access on local server
    #   # - 22/tcp # Uncomment to enable SSH
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}.entrypoints=http"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}.rule=Host(`${APP_NAME_PH_PIHOLE:-pihole}.${SUB_DOMAIN}.${DOMAIN}`)"
      - "traefik.http.middlewares.${APP_NAME_PH_PIHOLE:-pihole}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}.middlewares=${APP_NAME_PH_PIHOLE:-pihole}-https-redirect"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}-secure.entrypoints=https"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}-secure.rule=Host(`${APP_NAME_PH_PIHOLE:-pihole}.${SUB_DOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}-secure.tls=true"
      - "traefik.http.routers.${APP_NAME_PH_PIHOLE:-pihole}-secure.service=${APP_NAME_PH_PIHOLE:-pihole}"
      - "traefik.http.services.${APP_NAME_PH_PIHOLE:-pihole}.loadbalancer.server.port=${PORT_PH_PIHOLE:-80}"
      - "traefik.docker.network=traefiknet"

volumes:
  etc_pihole-unbound:
  etc_pihole_dnsmasq-unbound:

networks:
  traefiknet:
    name: ${DOCKER_NETWORK:-traefiknet}
    external: true