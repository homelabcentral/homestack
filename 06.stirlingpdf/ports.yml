services:
  # This makes StirlingPDF available only through traefik
  traefik: {}

  # This makes StirlingPDF available on all network interfaces of the host, including the host IP and through traefik (if enabled)
  localhost:
    ports:
      - ${PORT_SP_STIRLINGPDF_EXTERNAL:-3002}:${PORT_SP_STIRLINGPDF_INTERNAL:-8080}

  # This makes StirlingPDF available only on the Tailscale IP address of the host, allowing access over Tailscale VPN and through traefik (if enabled)
  tailscale:
    ports:
      - ${IP_TAILSCALE}:${PORT_SP_STIRLINGPDF_EXTERNAL:-3002}:${PORT_SP_STIRLINGPDF_INTERNAL:-8080}