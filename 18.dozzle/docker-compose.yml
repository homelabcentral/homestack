name: ${STACK_DZ_DOZZLE:-dozzle}
services:
  dozzle:
    image: ${DOCKER_IMAGE_DZ_DOZZLE:-amir20/dozzle:latest}
    container_name: ${CONTAINER_NAME_DZ_DOZZLE:-dozzle}
    hostname: ${HOST_NAME_DZ_DOZZLE:-dozzle}
    restart: ${RESTART_DZ_DOZZLE:-unless-stopped}
    networks:
      traefiknet:
        ipv4_address: ${IP_DZ_DOZZLE:-172.16.0.19}
    deploy:
      resources:
        limits:
          cpus: ${CPU_MAX_DZ_DOZZLE}
          memory: ${RAM_MAX_DZ_DOZZLE}
        reservations:
          cpus: ${CPU_MIN_DZ_DOZZLE:-0.05}
          memory: ${RAM_MIN_DZ_DOZZLE:-6M}
    extends:
          file: ports.yml # Change the ports config if you want to expose this container on different interfaces or ports. By default it is set to only be exposed through traefik, but you can change it to be exposed on localhost (all interfaces) or tailscale IP only. If you change it to localhost or tailscale, it will also be exposed through traefik if enabled.
          service: ${DZ_DOZZLE_PORT_CONFIG:-traefik} # traefik = only through traefik, all = bind to all interfaces on the host & traefik (if enabled), localhost = bind to only localhost, only host machine can access the port and no other devices on the same network and traefik (if enabled), tailscale = bind to tailscale IP only & traefik (if enabled)
    env_file:
      - .env
      - ../00.env/host.env
      - ../00.env/network.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DIR_DATA}/${DIR_DOZZLE:-dozzle}:/app/data
    # You do not need to change the external port, it is designed to work nicely with other containers.
    # The below comments are just for debugging, if you want to expose ports differently use the ports.yml file to change the exposed ports and interfaces above.
    # ports:
    #   - ${IP_TAILSCALE}:${PORT_DZ_DOZZLE_EXTERNAL:-3012}:${PORT_DZ_DOZZLE_INTERNAL:-8080}
    # OR if you don't want to bind to a specific IP, you can use:
    # ${PORT_DZ_DOZZLE_EXTERNAL:-3012}:${PORT_DZ_DOZZLE_INTERNAL:-8080}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}.entrypoints=http"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}.rule=Host(`${APP_NAME_DZ_DOZZLE:-dozzle}.${HOST_NAME}.${DOMAIN}`)"
      - "traefik.http.middlewares.${APP_NAME_DZ_DOZZLE:-dozzle}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}.middlewares=${APP_NAME_DZ_DOZZLE:-dozzle}-https-redirect"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}-secure.entrypoints=https"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}-secure.rule=Host(`${APP_NAME_DZ_DOZZLE:-dozzle}.${HOST_NAME}.${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}-secure.tls=true"
      - "traefik.http.routers.${APP_NAME_DZ_DOZZLE:-dozzle}-secure.service=${APP_NAME_DZ_DOZZLE:-dozzle}"
      - "traefik.http.services.${APP_NAME_DZ_DOZZLE:-dozzle}.loadbalancer.server.port=${PORT_DZ_DOZZLE_INTERNAL:-8080}"
      - "traefik.docker.network=${DOCKER_NETWORK:-traefiknet}"

networks:
  traefiknet:
    name: ${DOCKER_NETWORK:-traefiknet}
    external: true
