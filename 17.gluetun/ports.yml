services:
  # This makes the service available only through traefik
  traefik:
    ports:
      - 4000:8000/tcp # gluetun web API
      - 4001:8888/tcp # gluetun HTTP intranet
      - 4002:8388/tcp # gluetun shadow socks5 intranet
      - 4002:8388/udp # gluetun shadow socks5 intranet
      - 4004:6881/tcp # qbittorrent peer TCP
      - 4004:6881/udp # qbittorrent peer UDP
      - 4018:6881/tcp # deluge peer TCP
      - 4018:6881/udp # deluge peer UDP
      - 4019:58846    # deluge

  # This makes the service available on all network interfaces of the host, including the host IP and through traefik (if enabled)
  all:
    ports:
      - 4000:8000/tcp # gluetun web API
      - 4001:8888/tcp # gluetun HTTP intranet
      - 4002:8388/tcp # gluetun shadow socks5 intranet
      - 4002:8388/udp # gluetun shadow socks5 intranet
      - 4003:8080     # qbittorrent web UI
      - 4004:6881/tcp # qbittorrent peer TCP
      - 4004:6881/udp # qbittorrent peer UDP
      - 4005:5055     # seer web UI
      - 4006:8989     # sonarr web UI
      - 4007:7878     # radarr web UI
      - 4008:8686     # lidarr web UI
      - 4009:8787     # readarr web UI #  ghcr.io/faustvii/readarr:latest
      - 4010:6767     # bazarr web UI
      - 4011:9696     # prowlarr web UI
      - 4012:80       # librespeed web UI
      - 4013:3000     # firefox
      - 4014:8081     # metube web UI
      - 4015:8191     # flaresolverr
      - 4016:4545     # requestrr
      - 4017:8112     # deluge web UI
      - 4018:6881/tcp # deluge peer TCP
      - 4018:6881/udp # deluge peer UDP
      - 4019:58846    # deluge

# This makes the service available on all network interfaces of the host, including the host IP and through traefik (if enabled)
  localhost:
     ports:
      - 127.0.0.1:4000:8000/tcp # gluetun web API
      - 127.0.0.1:4001:8888/tcp # gluetun HTTP intranet
