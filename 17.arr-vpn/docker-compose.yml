    #       memory: ${MEM_MAX_PROWLARR}
    #     reservations:
    #       cpus: ${CPU_MIN_PROWLARR}
    #       memory: ${MEM_MIN_PROWLARR}
    env_file:
      - .env
      - ../00.env/network.env
      - ../00.env/host.env
    depends_on:
      - gluetun
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes:
