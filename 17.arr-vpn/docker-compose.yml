      - traefik.http.routers.${APP_NAME_AR_RADARR:-radarr}-secure.rule=Host(`${APP_NAME_AR_RADARR:-radarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.routers.${APP_NAME_AR_RADARR:-radarr}-secure.tls=true
      - traefik.http.routers.${APP_NAME_AR_RADARR:-radarr}-secure.service=${APP_NAME_AR_RADARR:-radarr}
      - traefik.http.services.${APP_NAME_AR_RADARR:-radarr}.loadbalancer.server.port=${PORT_AR_RADARR_INTERNAL:-7878}
      - traefik.http.routers.${APP_NAME_AR_SONARR:-sonarr}.rule=Host(`${APP_NAME_AR_SONARR:-sonarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_SONARR:-sonarr}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${APP_NAME_AR_SONARR:-sonarr}.middlewares=${APP_NAME_AR_SONARR:-sonarr}-https-redirect
      - traefik.http.routers.${APP_NAME_AR_SONARR:-sonarr}-secure.entrypoints=https
