      - traefik.http.routers.${APP_NAME_AR_LIDARR:-lidarr}.rule=Host(`${APP_NAME_AR_LIDARR:-lidarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_LIDARR:-lidarr}-https-redirect.redirectscheme.scheme=https
