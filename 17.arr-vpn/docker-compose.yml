    volumes:
      - ${DIR_DATA}/${DIR_ARR:-arr-vpn}/qbittorrent:/config
      - ${DIR_DOWNLOADS}/${DIR_ARR:-arr-vpn}/qbittorrent:/downloads
  firefox:
    image: ${DOCKER_IMAGE_AR_FIREFOX:-lscr.io/linuxserver/firefox:latest}
    container_name: ${CONTAINER_NAME_AR_FIREFOX:-firefox}
    network_mode: service:gluetun
    restart: ${RESTART_AR_GLUETUN:-unless-stopped}
    # deploy:
    #   resources:
    #     limits:
    #       cpus: ${CPU_MAX_FIREFOX}
    #       memory: ${MEM_MAX_FIREFOX}
    #     reservations:
    #       cpus: ${CPU_MIN_FIREFOX}
    #       memory: ${MEM_MIN_FIREFOX}
    env_file:
      - .env
      - ../00.env/network.env
      - ../00.env/host.env
    depends_on:
      - gluetun
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes:
      - ${DIR_DATA}/${DIR_ARR:-arr-vpn}/firefox:/config
      - ${DIR_DOWNLOADS}/${DIR_ARR:-arr-vpn}/firefox:/config/Downloads
    shm_size: 2gb
  speedtest:
    image: ${DOCKER_IMAGE_AR_SPEEDTEST:-henrywhitaker3/speedtest-tracker}
    container_name: ${CONTAINER_NAME_AR_SPEEDTEST:-speedtest}
    network_mode: service:gluetun
    restart: ${RESTART_AR_GLUETUN:-unless-stopped}
    # deploy:
    #   resources:
    #     limits:
    #       cpus: ${CPU_MAX_SPEEDTEST}
    #       memory: ${MEM_MAX_SPEEDTEST}
    #     reservations:
    #       cpus: ${CPU_MIN_SPEEDTEST}
    #       memory: ${MEM_MIN_SPEEDTEST}
    env_file:
      - .env
      - ../00.env/network.env
      - ../00.env/host.env
    depends_on:
      - gluetun
    volumes:
      - ${DIR_DATA}/${DIR_ARR:-arr-vpn}/speedtest:/config
    environment:
      - TZ=${TZ}
      - PGID=${GID}
      - PUID=${UID}
      - OOKLA_EULA_GDPR=true
      - INFLUXDB_RETENTION=5d
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: 200k
  prowlarr:
    image: ${DOCKER_IMAGE_AR_PROWLARR:-lscr.io/linuxserver/prowlarr:develop}
    container_name: ${CONTAINER_NAME_AR_PROWLARR:-prowlarr}
    network_mode: service:gluetun
    restart: ${RESTART_AR_GLUETUN:-unless-stopped}
    # deploy:
