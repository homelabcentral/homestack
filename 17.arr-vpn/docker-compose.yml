      - traefik.http.routers.${APP_NAME_AR_PROWLARR:-prowlarr}-secure.rule=Host(`${APP_NAME_AR_PROWLARR:-prowlarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.routers.${APP_NAME_AR_PROWLARR:-prowlarr}-secure.tls=true
      - traefik.http.routers.${APP_NAME_AR_PROWLARR:-prowlarr}-secure.service=${APP_NAME_AR_PROWLARR:-prowlarr}
      - traefik.http.services.${APP_NAME_AR_PROWLARR:-prowlarr}.loadbalancer.server.port=${PORT_AR_PROWLARR_INTERNAL:-9696}
      - traefik.http.routers.${APP_NAME_AR_BAZARR:-bazarr}.rule=Host(`${APP_NAME_AR_BAZARR:-bazarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_BAZARR:-bazarr}-https-redirect.redirectscheme.scheme=https
