  bazarr:
    image: ${DOCKER_IMAGE_AR_BAZARR:-lscr.io/linuxserver/bazarr:latest}
    container_name: ${CONTAINER_NAME_AR_BAZARR:-bazarr}
    network_mode: service:gluetun
