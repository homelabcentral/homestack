name: ${STACK_AR_VPN:-arr-vpn}
services:
  gluetun:
    image: ${DOCKER_IMAGE_AR_GLUETUN:-qmcgaw/gluetun}
    container_name: ${CONTAINER_NAME_AR_GLUETUN:-gluetun}
    hostname: ${HOST_NAME_AR_GLUETUN:-gluetun}
    restart: ${RESTART_AR_GLUETUN:-unless-stopped}
    networks:
      traefiknet:
        ipv4_address: ${IP_AR_GLUETUN:-172.16.0.18}
    # It is better to let the containers manage the resources themselves.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: ${CPU_MAX_AR_GLUETUN}
    #       memory: ${RAM_MAX_AR_GLUETUN}
    #     reservations:
    #       cpus: ${CPU_MIN_AR_GLUETUN:-0.05}
    #       memory: ${RAM_MIN_AR_GLUETUN:-6M}
    env_file:
      - .env
      - ../00.env/host.env
      - ../00.env/network.env
      - ../00.env/vpn.env
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      # OPENVPN settings
      # - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.ovpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_ENDPOINT_PORT=${OPENVPN_PORT}
      # WIREGUARD settings
      # - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      # - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      # - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # - WIREGUARD_PORT=${WIREGUARD_PORT}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - SERVER_CITIES=${SERVER_CITIES}
      - TZ=${TZ}
      # Uncomment the below line if you want to access the VPN through the host.
      # - SHADOWSOCKS=on
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${DIR_DATA}/${DIR_ARR:-arr-vpn}/gluetun:/gluetun
    # Uncomment this if not running traefik or other reverse proxy and want to access gatus directly via http://<IP_PUBLIC>:<PORT> or http://<IP_TAILSCALE>:<PORT>
    # You do not need to change the external port, it is designed to work nicely with other containers.
    ports:
      - ${IP_TAILSCALE}:4000:8000/tcp # gluetun web API
      - ${IP_TAILSCALE}:4001:8888/tcp # HTTP intranet
      - ${IP_TAILSCALE}:4002:8388/tcp # Shadowsocks
      - ${IP_TAILSCALE}:4002:8388/udp # Shadowsocks
      # - ${IP_TAILSCALE}:4004:8080 # qbittorrent
      - ${IP_TAILSCALE}:4005:6881/tcp # qbittorrent
      - ${IP_TAILSCALE}:4005:6881/udp # qbittorrent
      # - 4006:5055 # oversearr
      # - 4007:8989/tcp # sonarr
      # - 4008:7878/tcp # radarr
      # - 4009:8686/tcp # lidarr
      # - 4010:8787/tcp # readarr
      # - 4011:6767 # bazarr
      # - 4012:9696 # prowlarr
      # - 4013:80 # speedtest
      # - 4014:3000 # firefox
      # - 4015:8081 # metube
      # - 4016:8191 # flaresolverr
      # - 4545:4545 # requestrr
      - ${IP_TAILSCALE}:6881:6881 # deluge
      - ${IP_TAILSCALE}:6881:6881/udp # deluge
      - ${IP_TAILSCALE}:58846:58846 # deluge
      # OR if you don't want to bind to a specific IP, you can use:
      # 4000:8000/tcp # gluetun web API
      # 4001:8888/tcp # HTTP intranet
      # 4002:8388/tcp # Shadowsocks
      # 4002:8388/udp # Shadowsocks
      # 4004:8080 # qbittorrent
      # 4005:6881/tcp # qbittorrent
      # 4005:6881/udp # qbittorrent
      # 4006:5055 # oversearr
      # 4007:8989/tcp # sonarr
      # 4008:7878/tcp # radarr
      # 4009:8686/tcp # lidarr
      # 4010:8787/tcp # readarr
      # 4011:6767 # bazarr
      # 4012:9696 # prowlarr
      # 4013:80 # speedtest
      # 4014:3000 # firefox
      # 4015:8081 # metube
      # 4016:8191 # flaresolverr
      # 4545:4545 # requestrr
      # - 6881:6881 # deluge
      # - 6881:6881/udp # deluge
      # - 58846:58846 # deluge
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}.entrypoints=http
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}.rule=Host(`${APP_NAME_AR_QBITTORRENT:-qbittorrent}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_QBITTORRENT:-qbittorrent}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}.middlewares=${APP_NAME_AR_QBITTORRENT:-qbittorrent}-https-redirect
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}-secure.entrypoints=https
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}-secure.rule=Host(`${APP_NAME_AR_QBITTORRENT:-qbittorrent}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}-secure.tls=true
      - traefik.http.routers.${APP_NAME_AR_QBITTORRENT:-qbittorrent}-secure.service=${APP_NAME_AR_QBITTORRENT:-qbittorrent}
      - traefik.http.services.${APP_NAME_AR_QBITTORRENT:-qbittorrent}.loadbalancer.server.port=${PORT_AR_QBITTORRENT_INTERNAL:-8080}
      - traefik.http.routers.${APP_NAME_AR_FIREFOX:-firefox}.rule=Host(`${APP_NAME_AR_FIREFOX:-firefox}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_FIREFOX:-firefox}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${APP_NAME_AR_FIREFOX:-firefox}.middlewares=${APP_NAME_AR_FIREFOX:-firefox}-https-redirect
      - traefik.http.routers.${APP_NAME_AR_FIREFOX:-firefox}-secure.entrypoints=https
      - traefik.http.routers.${APP_NAME_AR_FIREFOX:-firefox}-secure.rule=Host(`${APP_NAME_AR_FIREFOX:-firefox}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.routers.${APP_NAME_AR_FIREFOX:-firefox}-secure.tls=true
      - traefik.http.routers.${APP_NAME_AR_FIREFOX:-firefox}-secure.service=${APP_NAME_AR_FIREFOX:-firefox}
      - traefik.http.services.${APP_NAME_AR_FIREFOX:-firefox}.loadbalancer.server.port=${PORT_AR_FIREFOX_INTERNAL:-3000}
      - traefik.http.routers.${APP_NAME_AR_SPEEDTEST:-speedtest}.rule=Host(`${APP_NAME_AR_SPEEDTEST:-speedtest}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_SPEEDTEST:-speedtest}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${APP_NAME_AR_SPEEDTEST:-speedtest}.middlewares=${APP_NAME_AR_SPEEDTEST:-speedtest}-https-redirect
      - traefik.http.routers.${APP_NAME_AR_SPEEDTEST:-speedtest}-secure.entrypoints=https
      - traefik.http.routers.${APP_NAME_AR_SPEEDTEST:-speedtest}-secure.rule=Host(`${APP_NAME_AR_SPEEDTEST:-speedtest}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.routers.${APP_NAME_AR_SPEEDTEST:-speedtest}-secure.tls=true
      - traefik.http.routers.${APP_NAME_AR_SPEEDTEST:-speedtest}-secure.service=${APP_NAME_AR_SPEEDTEST:-speedtest}
      - traefik.http.services.${APP_NAME_AR_SPEEDTEST:-speedtest}.loadbalancer.server.port=${PORT_AR_SPEEDTEST_INTERNAL:-80}
      - traefik.http.routers.${APP_NAME_AR_PROWLARR:-prowlarr}.rule=Host(`${APP_NAME_AR_PROWLARR:-prowlarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_PROWLARR:-prowlarr}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${APP_NAME_AR_PROWLARR:-prowlarr}.middlewares=${APP_NAME_AR_PROWLARR:-prowlarr}-https-redirect
