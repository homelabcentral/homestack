      - traefik.http.routers.${APP_NAME_AR_READARR:-readarr}.rule=Host(`${APP_NAME_AR_READARR:-readarr}.${HOST_NAME}.${DOMAIN}`)
      - traefik.http.middlewares.${APP_NAME_AR_READARR:-readarr}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${APP_NAME_AR_READARR:-readarr}.middlewares=${APP_NAME_AR_READARR:-readarr}-https-redirect
